# Проверки перед каждым коммитом. Установка: uv run pre-commit install
# ruff запускается через uv, поэтому его версия одна — та, что в uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat|cmd)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: forbid-data
        name: запрет коммита файлов из data/
        entry: файлы из data/ (включая реальные документы) нельзя коммитить
        language: fail
        files: ^data/
