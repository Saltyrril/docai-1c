name: p13_val_e3_tables
description: 'E3: таблица позиций построчно «графа: значение» (двухэтажная шапка склеена,
  строка номеров граф и пустые ячейки убраны) поверх E1 + E2. Гипотеза: исчезнет сдвиг
  граф в УПД и актах, F1 ячеек вырастет, доля без правок — на ≥ 4 п.п.; промпт станет
  длиннее.'
seed: 2026
data:
  source: dataset
  dataset: data\datasets\v1
  split: val
  n_docs: 150
  levels:
  - clean
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  exclude_ids_file: null
  dpi: 200
  real_root: data\real
extract:
  config: configs\extract.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v3
  vision_prompt: vision_v2
  date_format: printed
  text_tables: labeled
  postprocess:
    doc_type_by_title: true
  clean_input: pdf
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: '2026-11-18'
  worst: 5
  image_side: 1000
predictions_dir: data\experiments\eval
cache_name: null
compare_with: reports\2026-11-18_p13_val_e2_prompt\metrics.json
power_guard: true
