name: p13_val_base
description: 'База P13 на val: конфигурация по умолчанию после P12 (Qwen3.5-2B Q4_K_M,
  путь text, text_v2, date_format printed, постобработка P10). 150 документов сплита
  val, стратифицированы по типу, только clean (PDF с текстовым слоем).'
seed: 2026
data:
  source: dataset
  dataset: data\datasets\v1
  split: val
  n_docs: 150
  levels:
  - clean
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  exclude_ids_file: null
  dpi: 200
  real_root: data\real
extract:
  config: configs\extract_d48.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v2
  vision_prompt: vision_v2
  date_format: printed
  text_tables: null
  postprocess: null
  clean_input: pdf
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: '2026-11-18'
  worst: 5
  image_side: 1000
predictions_dir: data\experiments\eval
cache_name: null
compare_with: null
power_guard: true
