name: p12_matrix
description: 300 синтетических документов сплита test (из 304) и все размеченные реальные.
  Модели Qwen3.5 0.8B, 2B Q4_K_M, 2B Q8_0 и 4B Q4_K_M (только путь text, с проверкой,
  что она помещается в VRAM при контексте 8k); пути text, vision, ocr + LLM.
seed: 2026
batch_docs: 30
data:
  dataset: data\datasets\v1
  split: test
  n_docs: 300
  dpi: 200
  exclude_doc_ids: []
  include_real: true
  real_root: data\real
extract_config: configs\extract.yaml
models:
- id: q08
  tag: qwen3.5:0.8b
  paths:
  - text
  - vision
  - ocr
  skip_reason: null
  require_full_vram: false
  guess_s_per_item: 25.0
- id: q2q4
  tag: qwen3.5:2b-q4_K_M
  paths:
  - text
  - vision
  - ocr
  skip_reason: null
  require_full_vram: false
  guess_s_per_item: 40.0
- id: q2q8
  tag: qwen3.5:2b-q8_0
  paths:
  - text
  - vision
  - ocr
  skip_reason: null
  require_full_vram: false
  guess_s_per_item: 60.0
- id: q4q4
  tag: qwen3.5:4b-q4_K_M
  paths:
  - text
  skip_reason: null
  require_full_vram: true
  guess_s_per_item: 120.0
paths:
  text:
    mode: text
    levels:
    - clean
    clean_input: pdf
  vision:
    mode: vision
    levels:
    - clean
    - scan
    - photo
    clean_input: image
  ocr:
    mode: ocr
    levels:
    - clean
    - scan
    - photo
    clean_input: image
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: null
  worst: 5
  image_side: 1000
predictions_dir: data\experiments\eval
power_guard: true
