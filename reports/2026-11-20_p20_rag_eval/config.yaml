# Оценка RAG и абляции (шаг P20). Методика — как в P11 (D44–D45): единица выборки — вопрос,
# бутстреп 2000 повторов, 95% процентильный интервал, парный бутстреп и Макнемар для сравнений.
# Запуск (нужны индекс P19 и Ollama):
#   uv run docai rag eval --config configs/rag/eval_p20.yaml --stage all
#   uv run docai rag eval --config configs/rag/eval_p20.yaml --stage report
#   uv run docai rag eval --config configs/rag/eval_p20.yaml --set manual   # 30 вопросов владельца
name: p20_rag_eval
seed: 2026                 # бутстреп; генерация модели — seed из configs/rag/pipeline.yaml
n_resamples: 2000
pipeline_config: configs/rag/pipeline.yaml
questions: data/rag/questions.jsonl
fragments: data/rag/fragments.jsonl
manual_questions: data/rag/questions_manual.jsonl   # docai rag check-manual
cache_dir: data/experiments/rag_eval/p20
report_dir: reports/2026-11-20_p20_rag_eval
ks: [5, 10]
# Вопросы, по которым в P19 выбирались реранкер и промпт: на них оценка оптимистична,
# в отчёте есть отдельная строка «без затронутых вопросов».
tuned_on:
  - reports/2026-11-19_p19_rerankers/results.json
  - reports/2026-11-19_p19_rag_smoke/results.json
audit_notes:
  - "Первый просмотр показал, что проверка занижает правильность: ответы с датой словами («до 31 декабря 2025 г.») и числом с пояснением («3 (три) процента») не находили ключевой факт, а агрегаты по реестру сверялись с одним эталонным значением (строка даты или название), а не с ключевыми фактами. Исправлено до расчёта итоговых таблиц: `prepare` в `scoring.py` и сверка реестра по ключевым фактам; число неверных ответов основной конфигурации упало с 52 до 40."
  - "Все 40 неверных ответов основной конфигурации прочитаны (errors.md). Проверка ошибается в пользу «неверно» у 3: Q063 («арендная плата включает коммунальные услуги» — ключ «включен|входят|входит») Q116 («продление автоматически не происходит» — ключ «не предусмотрен|не продлева|…») и Q178 («Блиновой» вместо «Блинова» — падеж). Остальные 37 неверны или неполны (например, Q167 и Q170 — ответ без номера документа)."
  - "Категория «сравнение двух договоров»: все 8 ответов, засчитанных верными, прочитаны. Верны 6; Q155 — вывод «условия одинаковы» верен, но добавлено ложное расхождение; Q154 — вывод «не одинаковы» неверен (эталон: одинаковые), засчитан по совпадению чисел. Верхняя оценка категории — 8 из 25, по аудиту 6–7 из 25."
  - "Случайная выборка из 16 ответов других категорий, засчитанных верными (seed 7): все 16 верны по существу."
  - "Категория «доп. соглашение отменяет условие»: эталон — два пункта соглашения (сама правка и пункт о дате вступления в силу, D64). Пункт с правкой попал в контекст модели у 29 из 30 вопросов, пункт о дате — у 3; поэтому recall@5 и «эталон в контексте» в этой категории ≈ 52%, а правильность ответов — 80%."
ablations:
  - {name: bm25, label: "Только BM25", mode: bm25, reranker: false, run: [rag, none], reuse_from: full}
  - {name: vector, label: "Только векторы", mode: vector, reranker: false, run: [rag, none], reuse_from: full}
  - {name: hybrid, label: "Гибрид (BM25 + векторы, RRF)", mode: hybrid, reranker: false, run: [rag, none], reuse_from: full}
  # Дополнительная строка сверх списка задания: чем реранкер выигрывает на гибриде против одних векторов.
  - {name: vector_rerank, label: "Только векторы + реранкер", mode: vector, reranker: true, run: [rag, none], reuse_from: full}
  - {name: full, label: "Гибрид + реранкер (конвейер P19)", mode: hybrid, reranker: true, run: [rag, none, table]}
  - {name: no_router, label: "Гибрид + реранкер, без маршрутизатора SQL", mode: hybrid, reranker: true, router: false, run: [table], reuse_from: full}
