name: p13_test_final
description: 'Финальный замер P13: Qwen3.5-2B Q4_K_M, путь text, промпт text_v3 (E2,
  D51), тип и статус УПД по заголовку (E1, D50), таблицы grid. 154 документа test,
  не участвовавшие в анализе.'
seed: 2026
data:
  source: dataset
  dataset: data\datasets\v1
  split: test
  n_docs: null
  levels:
  - clean
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  exclude_ids_file: configs\eval\p13_test_seen_ids.txt
  dpi: 200
  real_root: data\real
extract:
  config: configs\extract_d48.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v3
  vision_prompt: vision_v2
  date_format: printed
  text_tables: grid
  postprocess:
    doc_type_by_title: true
  clean_input: pdf
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: '2026-11-18'
  worst: 5
  image_side: 1000
predictions_dir: data\experiments\eval
cache_name: null
compare_with: reports\2026-11-18_p13_test_base\metrics.json
power_guard: true
