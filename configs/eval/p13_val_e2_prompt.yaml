# P13, эксперимент E2: промпт text_v3 — правила для строки «наименование, адрес, ИНН/КПП»
# и для банковских счетов, пример без настоящих реквизитов (D51).
# Запуск: uv run docai eval --config configs/eval/p13_val_e2_prompt.yaml
# Отличие от p13_val_e1_doctype (принятой базы после E1) — только text_prompt: text_v3.
# Модель перезапускается (свой кэш), документы и seed те же — сравнение парное.
name: p13_val_e2_prompt
description: >-
  E2: промпт text_v3 поверх E1. Гипотеза: модель перестанет брать почтовый индекс за ИНН
  и корреспондентский счёт за расчётный; ошибки «соседнее поле», «адрес без индекса»
  и «поле не найдено» (к/с) сократятся вдвое, доля без правок вырастет на ≥ 8 п.п.
seed: 2026
data:
  source: dataset
  dataset: data/datasets/v1
  split: val
  n_docs: 150
  levels: [clean]
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  dpi: 200
extract:
  config: configs/extract.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v3       # E2 (D51); база — text_v2
  vision_prompt: vision_v2
  date_format: printed
  clean_input: pdf
  postprocess: {doc_type_by_title: true}   # принято в E1 (D50)
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: "2026-11-18"
  worst: 5
  image_side: 1000
predictions_dir: data/experiments/eval
compare_with: reports/2026-11-18_p13_val_e1_doctype/metrics.json
power_guard: true
