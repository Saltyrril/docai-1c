# P13, эксперимент E3b: исправленный E3 — таблица «графа: значение», где позиции помечены
# «Позиция N», а строки «Итого»/«Всего» — «Итоговая строка «…»» (D52).
# В E3 (p13_val_e3_tables) итоговые строки выглядели как позиции, и модель добавляла их в lines
# (лишние строки в 50 документах из 150). Отличие от p13_val_e2_prompt — только text_tables: labeled_v2.
# Запуск: uv run docai eval --config configs/eval/p13_val_e3b_tables_v2.yaml
name: p13_val_e3b_tables_v2
description: >-
  E3b: таблица позиций построчно «графа: значение», итоговые строки помечены отдельно,
  поверх E1 + E2. Гипотеза: сдвиг граф исчезнет, как в E3 (там 69 → 0 блокирующих),
  без лишних строк; доля без правок вырастет на ≥ 4 п.п. относительно E2.
seed: 2026
data:
  source: dataset
  dataset: data/datasets/v1
  split: val
  n_docs: 150
  levels: [clean]
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  dpi: 200
extract:
  config: configs/extract.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v3       # принято в E2 (D51)
  text_tables: labeled_v2    # E3b (D52): итоговые строки отдельно; база — grid
  vision_prompt: vision_v2
  date_format: printed
  clean_input: pdf
  postprocess: {doc_type_by_title: true}   # принято в E1 (D50)
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: "2026-11-18"
  worst: 5
  image_side: 1000
predictions_dir: data/experiments/eval
compare_with: reports/2026-11-18_p13_val_e2_prompt/metrics.json
power_guard: true
