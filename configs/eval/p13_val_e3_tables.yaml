# P13, эксперимент E3: таблица позиций в тексте для модели построчно «графа: значение» (D52).
# Запуск: uv run docai eval --config configs/eval/p13_val_e3_tables.yaml
# Отличие от p13_val_e2_prompt (принятой конфигурации после E1 и E2) — только text_tables: labeled.
# Модель перезапускается (свой кэш), документы и seed те же — сравнение парное.
name: p13_val_e3_tables
description: >-
  E3: таблица позиций построчно «графа: значение» (двухэтажная шапка склеена, строка номеров
  граф и пустые ячейки убраны) поверх E1 + E2. Гипотеза: исчезнет сдвиг граф в УПД и актах,
  F1 ячеек вырастет, доля без правок — на ≥ 4 п.п.; промпт станет длиннее.
seed: 2026
data:
  source: dataset
  dataset: data/datasets/v1
  split: val
  n_docs: 150
  levels: [clean]
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  dpi: 200
extract:
  config: configs/extract.yaml
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v3       # принято в E2 (D51)
  text_tables: labeled       # E3 (D52); база — grid
  vision_prompt: vision_v2
  date_format: printed
  clean_input: pdf
  postprocess: {doc_type_by_title: true}   # принято в E1 (D50)
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: "2026-11-18"
  worst: 5
  image_side: 1000
predictions_dir: data/experiments/eval
compare_with: reports/2026-11-18_p13_val_e2_prompt/metrics.json
power_guard: true
