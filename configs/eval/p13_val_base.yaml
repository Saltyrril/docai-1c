# P13: база для подбора изменений — конфигурация по умолчанию (D48) на val-выборке.
# Запуск: uv run docai eval --config configs/eval/p13_val_base.yaml
# Qwen3.5-2B Q4_K_M, путь text (текстовый слой PDF), промпт text_v2, даты как напечатаны.
# Подбор изменений P13 идёт только на val; test — для финального замера (p13_test_*).
name: p13_val_base
description: >-
  База P13 на val: конфигурация по умолчанию после P12 (Qwen3.5-2B Q4_K_M, путь text,
  text_v2, date_format printed, постобработка P10). 150 документов сплита val,
  стратифицированы по типу, только clean (PDF с текстовым слоем).
seed: 2026
data:
  source: dataset
  dataset: data/datasets/v1
  split: val
  n_docs: 150
  levels: [clean]
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: []
  dpi: 200
extract:
  config: configs/extract_d48.yaml   # умолчание до P13 (D48)
  mode: text
  cross_check: null
  model: qwen3.5:2b-q4_K_M
  text_prompt: text_v2
  vision_prompt: vision_v2
  date_format: printed
  clean_input: pdf
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: "2026-11-18"
  worst: 5
  image_side: 1000
predictions_dir: data/experiments/eval
compare_with: null
power_guard: true
