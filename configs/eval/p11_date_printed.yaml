# Эксперимент: даты «как напечатаны» вместо грамматики ГГГГ-ММ-ДД (D47).
# Запуск: uv run docai eval --config configs/eval/p11_date_printed.yaml
# Отличие от p11_baseline — только даты: схема черновика без format: date (date_format: printed)
# и промпты text_v2/vision_v2 (в v1 строка «Даты — в формате ГГГГ-ММ-ДД» заменена на «как напечатаны»).
# Выборка, seed и всё остальное — как у базы, поэтому сравнение парное (те же 100 документов).
name: p11_date_printed
description: >-
  Даты как напечатаны: схема черновика без format date и промпты text_v2/vision_v2
  (меняется только правило о датах). Остальное — как у p11_baseline: Qwen3.5-2B Q8_0,
  путь auto, те же 100 документов сплита test. Гипотеза: accuracy поля date вырастет
  с 16% до ≥ 80%, доля документов без правок — с 2% до ≥ 10%, остальные поля не изменятся.
seed: 2026
data:
  source: dataset
  dataset: data/datasets/v1
  split: test
  n_docs: 100
  levels: [clean, scan, photo]
  level_assignment: rotate
  doc_types: null
  exclude_doc_ids: [00016_upd, 00024_vat_invoice, 00043_bill, 00051_vat_invoice, 00069_act,
                    00088_act, 00144_bill, 00158_torg12, 00224_upd, 00449_torg12]
  dpi: 200
extract:
  config: configs/extract.yaml
  mode: auto
  cross_check: null
  model: qwen3.5:2b-q8_0
  text_prompt: text_v2
  vision_prompt: vision_v2
  date_format: printed
  clean_input: pdf
metrics:
  anls_threshold: 0.5
  row_match_threshold: 0.5
  calibration_bins: 10
bootstrap:
  n_resamples: 2000
  ci: 0.95
report:
  out_dir: reports
  date: null
  worst: 5
  image_side: 1000
predictions_dir: data/experiments/eval
compare_with: reports/2026-11-17_p11_baseline/metrics.json
power_guard: true            # считать только от сети, документы с батареей или сном — заново
